---
- name: Install bin/authfail
  ansible.builtin.copy:
    src: bin/authfail
    dest: "{{ jwodder_root }}/bin/authfail"
    owner: "{{ admin_user }}"
    mode: "0755"
  notify:
    - Restart authfail.service if running

- name: Ensure authfail errfile exists
  ensure_file:
    path: "{{ jwodder_root }}/logs/authfail.err"
    owner: syslog
    group: syslog
    mode: "0644"

- name: Undo "Make rsyslog apparmor profile unconfined" from previous setup
  ansible.builtin.lineinfile:
    dest: /etc/apparmor.d/usr.sbin.rsyslogd
    regexp: '^profile rsyslogd /usr/sbin/rsyslogd '
    line: 'profile rsyslogd /usr/sbin/rsyslogd flags=(attach_disconnected) {'
    backup: true
  notify:
    - Restart apparmor

- name: Remove apparmor config for authfail from previous setup
  ansible.builtin.file:
    path: /etc/apparmor.d/rsyslog.d/authfail.apparmor
    state: absent
  notify:
    - Restart apparmor

- name: Install authfail socket & service units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    mode: "0644"
  with_items:
    - authfail.service
    - authfail.socket
  register: authfail_units

# This has to run before we can enable stuff, so using a handler isn't an
# option here.
- name: Reload systemd  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: authfail_units is changed

- name: Enable socket unit
  ansible.builtin.systemd:
    name: authfail.socket
    enabled: true

- name: Configure rsyslog to send failed SSH logins to FIFO
  ansible.builtin.template:
    src: 99-authfail.conf
    dest: /etc/rsyslog.d/99-authfail.conf
    owner: root
    mode: "0644"
    backup: true
  notify:
    - Restart rsyslog
