---
# Based on <https://repos-droplet.digitalocean.com/install.sh> (linked from
# <https://docs.digitalocean.com/products/droplets/how-to/manage-agent/>) as of
# 2026-05-24

- name: Download DigitalOcean droplet agent package key
  ansible.builtin.get_url:
    url: https://repos-droplet.digitalocean.com/gpg.key
    dest: /usr/share/keyrings/droplet-agent-keyring.gpg.asc
    owner: root
    mode: "0644"
    force: false

- name: Dearmor package key
  ansible.builtin.command: >
    gpg --dearmor --output /usr/share/keyrings/droplet-agent-keyring.gpg /usr/share/keyrings/droplet-agent-keyring.gpg.asc
  args:
    creates: /usr/share/keyrings/droplet-agent-keyring.gpg

- name: Create droplet-agent.sources file
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/droplet-agent.sources
    content: |
      Types: deb
      URIs: https://repos-droplet.digitalocean.com/apt/droplet-agent
      Suites: main
      Components: main
      Signed-By: /usr/share/keyrings/droplet-agent-keyring.gpg
    owner: root
    mode: "0644"

- name: Create droplet-agent.pref file
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/droplet-agent.pref
    content: |
      Package: *
      Pin: origin repos-droplet.digitalocean.com
      Pin-Priority: 100
    owner: root
    mode: "0644"

- name: Install DigitalOcean droplet agent
  ansible.builtin.apt:
    name:
      - droplet-agent
      - droplet-agent-keyring
    state: present
    update_cache: true
