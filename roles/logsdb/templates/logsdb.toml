[database]
database = "{{ logsdb_db }}"
username = "{{ logsdb_user }}"
password = "{{ logsdb_password }}"

[features]
apache_access = true
authfail = true
maillog = true

[dailyreport]
recipient = "{{ dailyreport_recipient }}"
mailbox = "/home/{{ admin_user }}/Mail/INBOX"
logs_dir = "{{ jwodder_root }}/logs"
