<VirtualHost _default_:80>
    ServerName dav.{{ apache_base_domain }}
    Redirect permanent / https://dav.{{ apache_base_domain }}/
</VirtualHost>

<VirtualHost _default_:443>
    ServerName dav.{{ apache_base_domain }}
    ServerAdmin {{ apache_webmaster_email }}
    LogLevel info ssl:warn

    SSLEngine on
    SSLCertificateFile       /etc/letsencrypt/live/{{ certbot_cert_name }}/cert.pem
    SSLCertificateKeyFile    /etc/letsencrypt/live/{{ certbot_cert_name }}/privkey.pem
    SSLCertificateChainFile  /etc/letsencrypt/live/{{ certbot_cert_name }}/chain.pem

    Include conf-available/radicale-uwsgi.conf
    <LocationMatch "${_RADICALE_LOCATION_MATCH}">
        AuthType Basic
        AuthName "Radicale: Authentication Required"
        AuthBasicProvider file
        AuthUserFile "/etc/radicale/passwd"
        AllowOverride None
        Require valid-user
    </LocationMatch>
    UnDefine _RADICALE_PREFIX
    UnDefine _RADICALE_APP
    UnDefine _RADICALE_LOCATION_MATCH
</VirtualHost>

# vim: ft=apache et sts=4
