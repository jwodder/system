<VirtualHost _default_:80>
    Redirect permanent / https://www.{{ apache_base_domain }}/
</VirtualHost>

<VirtualHost _default_:443>
    ServerName www.{{ apache_base_domain }}
    ServerAdmin {{ apache_webmaster_email }}
    DocumentRoot /var/www/html
    AddDefaultCharset utf-8
    RemoveHandler pl
    LogLevel info ssl:warn

    SSLEngine on
    SSLCertificateFile       /etc/letsencrypt/live/{{ certbot_cert_name }}/cert.pem
    SSLCertificateKeyFile    /etc/letsencrypt/live/{{ certbot_cert_name }}/privkey.pem
    SSLCertificateChainFile  /etc/letsencrypt/live/{{ certbot_cert_name }}/chain.pem

    <Directory "/var/www/html">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost _default_:443>
    ServerName {{ apache_base_domain }}
    Redirect permanent / https://www.{{ apache_base_domain }}/

    SSLEngine on
    SSLCertificateFile       /etc/letsencrypt/live/{{ certbot_cert_name }}/cert.pem
    SSLCertificateKeyFile    /etc/letsencrypt/live/{{ certbot_cert_name }}/privkey.pem
    SSLCertificateChainFile  /etc/letsencrypt/live/{{ certbot_cert_name }}/chain.pem
</VirtualHost>

# vim: ft=apache et sts=4
